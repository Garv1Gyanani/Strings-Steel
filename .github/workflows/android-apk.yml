name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Download Godot & Export Templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q templates.tpz "templates/android_*" "templates/version.txt"
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Import project & run SmokeTest
        run: |
          godot --headless --path . --import
          godot --headless --path . --script res://tools/SmokeTest.gd

      - name: Configure Godot Android SDK & Keystore paths
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "${ANDROID_HOME}" "${JAVA_HOME}" "${HOME}" > ~/.config/godot/editor_settings-4.7.tres

      - name: Export Android APK
        run: |
          mkdir -p build/android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="${HOME}/.android/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_RELEASE_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="android" \
          godot --headless --path . --export-release "Android" build/android/StringsAndSteel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StringsAndSteel-Android-APK
          path: build/android/StringsAndSteel.apk
